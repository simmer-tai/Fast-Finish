<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>result preview</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;800&family=Noto+Sans+JP:wght@500&display=swap" />
  </head>
  <body style="background: linear-gradient(160deg, #9a9a9a, #d0d0d0)">
    <!-- 結果の画面だけを確かめる。index.html の CSS と #overlay をそのまま借りて、result.js で出す。
         ?rank=S|A|B|C&skip=秒 で、ランクと飛ばすタイミングを変えられる。クリック / Enter で飛ばす・出し直す -->
    <script type="module">
      const src = await (await fetch('index.html')).text();
      const doc = new DOMParser().parseFromString(src, 'text/html');
      for (const style of doc.querySelectorAll('style')) document.head.append(style);
      const overlay = doc.getElementById('overlay');
      overlay.className = 'pause result';
      document.body.append(overlay);
      await document.fonts.load('800 100px "Barlow Condensed"');
      const { showResult, skipResult } = await import('./dist/result.js');
      const audio = await import('./dist/audio.js');
      const p = new URLSearchParams(location.search);
      const perKill = { S: 400, A: 260, B: 180, C: 120 }[p.get('rank') ?? 'S'];
      const run = () =>
        showResult({
          stageNo: '01', stageName: 'STATION', difficulty: 'NORMAL',
          time: 83.47, kills: 15, damage: p.get('rank') === 'S' ? 0 : 24, score: perKill * 15, newTime: true, newScore: true,
        });
      run();
      if (p.has('skip')) setTimeout(skipResult, Number(p.get('skip')) * 1000);
      const again = () => {
        audio.ensureUiAudio();
        if (!skipResult()) run();
      };
      addEventListener('pointerdown', again);
      addEventListener('keydown', (e) => e.code === 'Enter' && again());
    </script>
  </body>
</html>
