<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pad Test</title>
<style>
  :root { --bg: #ececec; --ink: #333; --soft: rgba(51, 51, 51, 0.5); --on: #e8462b; }
  body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--ink); font: 15px/1.6 ui-monospace, Consolas, monospace; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .note { color: var(--soft); margin: 0 0 16px; }
  .pad { border-top: 1px solid var(--soft); padding: 12px 0; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .b { min-width: 34px; padding: 4px 6px; text-align: center; border: 1px solid var(--soft); }
  .b.on { background: var(--on); color: #fff; border-color: var(--on); }
  #log { white-space: pre-wrap; color: var(--soft); }
</style>
</head>
<body>
<h1>ゲームパッドの確認</h1>
<p class="note">このページを開いたまま、パッドのボタンをどれか押してください（押すまでブラウザはパッドを見せません）。</p>
<div id="info"></div>
<div id="pads"></div>
<div id="log"></div>
<script>
  const info = document.getElementById('info');
  const padsEl = document.getElementById('pads');
  const log = document.getElementById('log');
  const lines = [];
  const addLog = (t) => { lines.unshift(`${new Date().toLocaleTimeString()} ${t}`); log.textContent = lines.slice(0, 10).join('\n'); };
  info.textContent = `isSecureContext: ${window.isSecureContext} / getGamepads: ${typeof navigator.getGamepads} / ${location.protocol}`;
  addEventListener('gamepadconnected', (e) => addLog(`接続: ${e.gamepad.id} (mapping="${e.gamepad.mapping}")`));
  addEventListener('gamepaddisconnected', (e) => addLog(`切断: ${e.gamepad.id}`));
  function frame() {
    let pads = [];
    try { pads = [...(navigator.getGamepads?.() ?? [])].filter(Boolean); } catch (err) { info.textContent += ` / エラー: ${err.message}`; return; }
    padsEl.innerHTML = pads.length ? pads.map((p) => `
      <div class="pad">
        <div>#${p.index} ${p.id}</div>
        <div>mapping: "${p.mapping}" / buttons: ${p.buttons.length} / axes: ${p.axes.length}</div>
        <div class="btns">${p.buttons.map((b, i) => `<span class="b ${b.pressed || b.value > 0.3 ? 'on' : ''}">${i}</span>`).join('')}</div>
        <div>axes: ${p.axes.map((a, i) => `${i}:${a.toFixed(2)}`).join('  ')}</div>
      </div>`).join('') : '<div class="pad">パッドが見えていません</div>';
    requestAnimationFrame(frame);
  }
  frame();
</script>
</body>
</html>
